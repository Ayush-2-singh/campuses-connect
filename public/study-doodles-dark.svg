<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Study-themed doodle background — dark strokes for light theme -->
  <g fill="none" stroke="#1f2430" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- open book -->
    <g transform="translate(50 50) rotate(-5)">
      <path d="M-16 10 V-6 Q-8 -12 0 -8 Q8 -12 16 -6 V10 Q8 6 0 10 Q-8 6 -16 10 Z"/>
      <path d="M0 -8 V10"/>
    </g>
    <!-- pencil -->
    <g transform="translate(140 42) rotate(12)">
      <path d="M-2 -16 L2 -16 L3 -6 L0 -3 L-3 -6 Z"/>
      <path d="M-3 -6 H3 V12 H-3 Z"/>
      <path d="M-3 12 L0 16 L3 12"/>
      <path d="M-3 0 H3"/>
    </g>
    <!-- calculator -->
    <g transform="translate(230 55) rotate(-4)">
      <rect x="-11" y="-10" width="22" height="20" rx="2"/>
      <line x1="-7" y1="-4" x2="7" y2="-4"/>
      <line x1="-7" y1="0" x2="-3" y2="0"/>
      <line x1="0" y1="0" x2="3" y2="0"/>
      <line x1="6" y1="0" x2="7" y2="0"/>
      <line x1="-7" y1="4" x2="-3" y2="4"/>
      <line x1="0" y1="4" x2="3" y2="4"/>
      <line x1="6" y1="4" x2="7" y2="4"/>
      <line x1="-7" y1="7" x2="7" y2="7"/>
    </g>
    <!-- graduation cap -->
    <g transform="translate(320 45) rotate(6)">
      <path d="M-15 -2 L0 -10 L15 -2 L0 5 Z"/>
      <path d="M-7 1 V7 Q0 11 7 7 V1"/>
      <path d="M15 -2 V7"/>
      <circle cx="15" cy="9" r="1.5"/>
    </g>
    <!-- lightbulb -->
    <g transform="translate(90 135) rotate(-8)">
      <path d="M0 -12 A9 9 0 0 1 6 -3 Q7 2 4 4 H-4 Q-7 2 -6 -3 A9 9 0 0 1 0 -12 Z"/>
      <line x1="-3" y1="6" x2="3" y2="6"/>
      <line x1="-3" y1="9" x2="3" y2="9"/>
      <line x1="-2" y1="12" x2="2" y2="12"/>
    </g>
    <!-- laptop -->
    <g transform="translate(185 128) rotate(3)">
      <path d="M-16 -4 H16 V8 H-16 Z"/>
      <path d="M-18 8 H18 V11 H-18 Z"/>
      <path d="M-10 2 H10"/>
    </g>
    <!-- headphones -->
    <g transform="translate(280 130) rotate(-6)">
      <path d="M-9 2 Q-9 -10 0 -10 Q9 -10 9 2"/>
      <rect x="-12" y="1" width="6" height="9" rx="2"/>
      <rect x="6" y="1" width="6" height="9" rx="2"/>
    </g>
    <!-- ruler -->
    <g transform="translate(340 140) rotate(8)">
      <rect x="-4" y="-15" width="8" height="30" rx="1"/>
      <line x1="-4" y1="-10" x2="-1" y2="-10"/>
      <line x1="-4" y1="-5" x2="-2" y2="-5"/>
      <line x1="-4" y1="0" x2="-1" y2="0"/>
      <line x1="-4" y1="5" x2="-2" y2="5"/>
      <line x1="-4" y1="10" x2="-1" y2="10"/>
    </g>
    <!-- notebook -->
    <g transform="translate(48 225) rotate(5)">
      <rect x="-10" y="-13" width="20" height="26" rx="2"/>
      <line x1="-6" y1="-8" x2="6" y2="-8"/>
      <line x1="-6" y1="-4" x2="6" y2="-4"/>
      <line x1="-6" y1="0" x2="4" y2="0"/>
      <line x1="-6" y1="4" x2="6" y2="4"/>
      <line x1="-10" y1="-10" x2="-10" y2="10"/>
    </g>
    <!-- flask / beaker -->
    <g transform="translate(140 230) rotate(-10)">
      <path d="M-3 -14 V-4 L-10 10 Q-10 14 0 14 Q10 14 10 10 L3 -4 V-14"/>
      <line x1="-3" y1="-14" x2="3" y2="-14"/>
      <ellipse cx="0" cy="6" rx="5" ry="3"/>
    </g>
    <!-- alarm clock -->
    <g transform="translate(235 228) rotate(4)">
      <circle cx="0" cy="0" r="10"/>
      <line x1="0" y1="0" x2="0" y2="-6"/>
      <line x1="0" y1="0" x2="4" y2="2"/>
      <line x1="-8" y1="-10" x2="-5" y2="-7"/>
      <line x1="8" y1="-10" x2="5" y2="-7"/>
      <line x1="-6" y1="10" x2="-10" y2="14"/>
      <line x1="6" y1="10" x2="10" y2="14"/>
    </g>
    <!-- magnifying glass -->
    <g transform="translate(320 225) rotate(-7)">
      <circle cx="0" cy="0" r="8"/>
      <line x1="6" y1="6" x2="13" y2="13"/>
    </g>
    <!-- sticky note -->
    <g transform="translate(95 318) rotate(3)">
      <path d="M-10 -10 H10 V10 L-10 -10 Z"/>
      <line x1="-6" y1="-5" x2="4" y2="-5"/>
      <line x1="-6" y1="-1" x2="6" y2="-1"/>
      <line x1="-6" y1="3" x2="2" y2="3"/>
    </g>
    <!-- coffee cup (late night study) -->
    <g transform="translate(185 320) rotate(-5)">
      <path d="M-8 -2 H8 V6 Q8 12 0 12 Q-8 12 -8 6 Z"/>
      <path d="M8 1 Q13 2 12 6 Q11 9 8 8"/>
      <path d="M-3 -6 Q-1 -9 -3 -12 M2 -6 Q4 -9 2 -12"/>
    </g>
    <!-- bookmark -->
    <g transform="translate(275 315) rotate(6)">
      <path d="M-6 -12 H6 V14 L0 9 L-6 14 Z"/>
      <line x1="-3" y1="-7" x2="3" y2="-7"/>
      <line x1="-3" y1="-3" x2="3" y2="-3"/>
    </g>
    <!-- compass (geometry) -->
    <g transform="translate(340 320) rotate(-3)">
      <circle cx="0" cy="0" r="9"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <circle cx="0" cy="0" r="2"/>
    </g>
    <!-- tiny sparkles -->
    <g transform="translate(185 85) rotate(15)">
      <path d="M0 -5 V5 M-5 0 H5"/>
    </g>
    <g transform="translate(85 180) rotate(-10)">
      <path d="M0 -4 V4 M-4 0 H4"/>
    </g>
    <g transform="translate(270 180) rotate(20)">
      <path d="M0 -4 V4 M-4 0 H4"/>
    </g>
    <g transform="translate(185 270) rotate(-15)">
      <path d="M0 -4 V4 M-4 0 H4"/>
    </g>
  </g>
</svg>
