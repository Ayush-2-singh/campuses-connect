<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1115" />
    <title>CampusConnect — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0F1115;
        color: #E8E9ED;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        text-align: center;
      }
      .logo {
        width: 60px; height: 60px;
        border-radius: 18px;
        background: linear-gradient(135deg, #D4A843, #E0A83C);
        display: grid; place-items: center;
        font-size: 28px; font-weight: 700; color: #1D1503;
      }
      h1 { font-size: 19px; margin: 4px 0 0; font-weight: 700; }
      p {
        font-size: 14px; line-height: 1.55; color: #8B93A3;
        margin: 0; max-width: 320px;
      }
      button {
        margin-top: 10px;
        min-height: 46px;
        min-width: 190px;
        padding: 0 22px;
        border: 0; border-radius: 11px;
        background: #D4A843; color: #1D1503;
        font-size: 15px; font-weight: 700; font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.98); opacity: .9; }
      .hint { font-size: 12px; color: #697383; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">C</div>
      <h1>You're offline</h1>
      <p>
        CampusConnect needs a connection to load your campus feed, messages and
        notes. Check your network and try again.
      </p>
      <button type="button" onclick="retry()">Try again</button>
      <div class="hint">Your saved session is kept — you won't need to log in again.</div>
    </div>
    <script>
      function retry() {
        // Reloading re-attempts the remote `server.url` load.
        location.reload();
      }
    </script>
  </body>
</html>
